<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.7, maximum-scale=0.7">
  <title>secretlabel</title>
  <link rel="icon" href="sl-icon-white.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SPLASH -->
  <div id="splash" class="splash">
    <svg id="splash-logo" class="splash-logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="ripple-s">
          <feTurbulence id="turb-s" type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="1" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="ripple-l">
          <feTurbulence id="turb-l" type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
      <g id="logo-nodes" fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="miter" paint-order="stroke fill" font-family="Helvetica Neue, Arial Black, Arial, sans-serif" font-weight="900" font-size="110">
        <g style="transform: translate(var(--s-x), 118px) scale(1.2, 0.8) translate(-77px, -118px);">
          <text data-noise data-letter="s" filter="url(#ripple-s)" x="77" y="118" text-anchor="middle">S</text>
        </g>
        <g style="transform: translate(var(--l-x), 118px) scale(0.6, 1.25) translate(-140px, -118px);">
          <text data-noise data-letter="l" filter="url(#ripple-l)" x="140" y="118" text-anchor="middle">L</text>
        </g>
      </g>
    </svg>
    <p class="hint">click to enter</p>
  </div>

  <!-- SITE -->
  <div id="site" class="site">

    <div class="header">
      <a href="./" >
        <img src="sl-icon-white.png" alt="secretlabel" class="header-icon">
      </a>
      <a href="/" >
        <h1 class="logo">secretlabel</h1>
      </a>

    </div>

    <section class="releases-section closed">

      <div class="releases">

        <div class="card" data-bandcamp="https://11ai.bandcamp.com/" data-embed="3077717520" data-embed-type="album" data-img="images/sl001-back2.jpg" data-alt="color coordinates cover art" data-catalog="SL001" data-title="Leapyear Register" data-artist="11ai" data-date="Releasing June 30, 2026" data-brief="Leapyear Register, 11ai's first self-released album in four years, pays homage to the adventurous spirit of 1990s and early-2000s electronica. Inspirations of house, IDM, ambient, drum & bass, and electro-pop are filtered through 11ai’s production style of playful futurism and complex harmonic language, designed for the dancer and the listener.
        <br><br>
        First physical discs will be available at the <a href='https://instagram.com/11ai.link'>CD release party</a> at Sun Space in Los Angeles on August 15th.
       <br><br>
       Album out on all digital platforms on July 30th.">
          <img src="images/sl001-back2.jpg" alt="color coordinates cover art">
          <div class="card-text">
            <span class="card-catalog">SL001</span>
            <span class="card-title">Leapyear Register</span>
            <span class="card-artist">11ai</span>
            <span class="card-date">Released Digitally June 30, 2026</span>
            <span class="card-date">CD Available August 15, 2026</span>
          </div>
        </div>

        <div class="card" data-bandcamp="https://drinksmenu.bandcamp.com/album/secret-disc" data-embed="2752634160" data-embed-type="album" data-linkcol="de270f" data-img="sl000.jpg" data-alt="•SECRET DISC• cover art" data-catalog="SL000" data-title="•SECRET DISC•" data-artist="DRINKS MENU" data-date="Released August 4, 2025" data-brief="The disc(s) are real. Given out at shows to supporters only. ">
          <img src="sl000.jpg" alt="•SECRET DISC• cover art">
          <div class="card-text">
            <span class="card-catalog">SL000</span>
            <span class="card-title">SECRET DISC</span>
            <span class="card-artist">DRINKS MENU</span>
            <span class="card-date">Released August 4, 2025</span>
          </div>
        </div>

      </div>

    </section>

    <footer class="info">
      <p>Electronic music CD label. Boutique physical pressings based in Los Angeles, CA.</p>
      <p>Discogs: <a href="https://www.discogs.com/label/4373509-Secret-Label" target="_blank">Secret Label</a></p>
    </footer>

  </div>

  <!-- Release detail modal -->
  <div id="modal" class="modal">
    <div class="modal-backdrop"></div>
    <div class="modal-panel">
      <button class="modal-close">&times;</button>
      <div class="modal-body">
        <img class="modal-img" src="" alt="">
        <div class="modal-info">
          <span class="modal-catalog"></span>
          <h2 class="modal-title"></h2>
          <span class="modal-artist"></span>
          <span class="modal-date"></span>
        </div>
        <div class="modal-brief"></div>
        <a class="modal-link" href="" target="_blank">Listen on Bandcamp &rarr;</a>
        <div class="modal-bandcamp"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
